$('pa').onclick=e=>{e.stopPropagation();pause(true)};$('rs').onclick=()=>pause(false);addEventListener('keydown',e=>{if(e.key=='p'||e.key=='Escape')pause(!paused)});document.addEventListener('visibilitychange',()=>document.hidden&&pause(true));

$('go').onclick=start;
function update(dt){t+=dt;const play=state=='play';if(play)speed=Math.min(36,speed+dt*.35);const sp=play?speed:state=='ready'?7:0;
sandT.offset.y+=sp*dt/5;seaT.offset.y+=sp*dt/6.25;seaT.offset.x+=dt*.01;
palms.forEach(p=>{p.position.z+=sp*dt;if(p.position.z>14)p.position.z-=140});clouds.forEach(c=>{c.position.x+=dt*.8;if(c.position.x>90)c.position.x=-90});
const tx=lanes[lane];M.position.x+=(tx-M.position.x)*Math.min(1,dt*14);
if(play){if(mag>0)mag-=dt;if(fly>0){fly-=dt;if(fly<=0){spawnD=gap*.5;wingsG.forEach(w=>w.visible=false)}}if(fly<=0){spawnD+=sp*dt;if(spawnD>gap){spawnD=0;gap=Math.max(13,speed*.75);spawnRow()}}score+=sp*dt*.1;
obs.forEach(o=>o.position.z+=sp*dt);gy=0;obs.forEach(o=>{const u=o.userData;if(u.type=='train'&&Math.abs(o.position.z)<u.d/2+.3&&Math.abs(o.position.x-M.position.x)<.95&&M.position.y>=u.h-.8)gy=u.h});vy-=34*dt;let ny=M.position.y+vy*dt;if(fly>0){vy=0;const up=fly>.9;ny=M.position.y+((up?7:0)-M.position.y)*Math.min(1,dt*(up?3:6))}else if(ny<=gy){ny=gy;if(vy<0)vy=0}M.position.y=ny;if(slide>0)slide-=dt;if(jb>0){jb-=dt;if(ny<=gy+.05&&vy<=0){vy=12.5;slide=0;jb=0;sfxJump()}}
for(let i=obs.length-1;i>=0;i--){const o=obs[i],u=o.userData;
if(fly<=0&&Math.abs(o.position.z)<u.d/2+.3&&Math.abs(o.position.x-M.position.x)<.75){const y=M.position.y;if((u.type=='train'&&y<u.h-.8)||(u.type=='high'&&slide<=0&&y<1.7)||(u.type!='high'&&u.type!='train'&&y<u.h-.05)){die();break}}
if(o.position.z>u.d/2+10){S.remove(o);obs.splice(i,1)}}
for(let i=coins.length-1;i>=0;i--){const c=coins[i];c.position.z+=sp*dt;c.rotation.y+=dt*4;if(mag>0&&c.position.y<5&&Math.abs(c.position.x-M.position.x)<3.3&&c.position.z>-10&&c.position.z<1.5){const k=Math.min(1,dt*9);c.position.x+=(M.position.x-c.position.x)*k;c.position.y+=(M.position.y+1-c.position.y)*k;c.position.z+=(0-c.position.z)*k*.4}
if(Math.abs(c.position.z)<1&&Math.abs(c.position.x-M.position.x)<1&&c.position.y>M.position.y-.3&&c.position.y<M.position.y+2.4){S.remove(c);coins.splice(i,1);bn++;score+=2;sfxCoin()}else if(c.position.z>10){S.remove(c);coins.splice(i,1)}}
for(let i=pups.length-1;i>=0;i--){const p=pups[i];p.position.z+=sp*dt;p.rotation.y+=dt*2.5;p.position.y=1.5+Math.sin(t*4)*.15;if(fly<=0&&Math.abs(p.position.z)<1.1&&Math.abs(p.position.x-M.position.x)<1.1&&M.position.y<2.6){const k=p.userData.k;S.remove(p);pups.splice(i,1);if(k=='mag'){mag=8;sfxCoin()}else{fly=7;vy=0;skyField();wingsG.forEach(w=>w.visible=true);sfxSlide()}}else if(p.position.z>10){S.remove(p);pups.splice(i,1)}}}
else if(state=='over'){M.rotation.x=Math.min(M.rotation.x+dt*5,1.4)}
/* anim */
if(state!='over'){ph+=dt*(4+sp*.45);const air=M.position.y>gy+.05,sl=slide>0&&play,k=air?0:1;
const L=(o,p,v)=>o.rotation[p]+=(v-o.rotation[p])*Math.min(1,dt*22);
L(lL,'x',sl?.15:air?1.5:Math.sin(ph)*.9);L(lR,'x',sl?-.35:air?1.15:-Math.sin(ph)*.9);L(aL,'x',sl?1:air?2.95:-Math.sin(ph)*.9);L(aR,'x',sl?-.4:air?2.95:Math.sin(ph)*.9);L(aL,'z',air&&!sl?-.4:0);L(aR,'z',air&&!sl?.4:0);
const k2=Math.min(1,dt*16);B.rotation.z+=((sl?-.55:0)-B.rotation.z)*k2;B.rotation.x+=((sl?1:0)-B.rotation.x)*k2;B.position.y+=((sl?.55:1+(air?0:Math.abs(Math.sin(ph))*.07))-B.position.y)*k2}
const lean=tx-M.position.x;tip.rotation.z=lean*.06+Math.sin(t*3)*.03;tip.rotation.x=.05+Math.sin(t*2.2)*.03-sp*.002;lureObj.rotation.y=t*1.5;magR.visible=mag>0;magR.scale.setScalar(1+Math.sin(t*8)*.08);
shake=Math.max(0,shake-dt);const sh=shake*.5;C.position.x=(Math.random()-.5)*sh;C.position.y=(innerWidth<innerHeight?5.4:4.4)+M.position.y*.4;C.lookAt(0,2.2+M.position.y*.5,-9);
$('sc').textContent=(score|0)+' m'+(mag>0?'   Magnet '+Math.ceil(mag)+'s':'')+(fly>0?'   Fly '+Math.ceil(fly)+'s':'');$('bnn').textContent=bn}
let last=performance.now();(function loop(n){requestAnimationFrame(loop);const dt=Math.min((n-last)/1000,.05);last=n;if(!paused)update(dt);R.render(S,C)})(last);
